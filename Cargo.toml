[package]
name = "distribute_kv_openraft"
version = "0.1.0"
edition = "2024"

[dependencies]
async-trait = "0.1.89"

# storage
rocksdb = "0.24.0"

# web
axum = "0.8.8"
tokio = { version = "1.49.0", features = ["full", "sync"] }
serde = { version = "1.0.200", features = ["derive"] }
serde_json = "1.0.141"
tower = "0.5.2"
tower-http = { version = "0.6.8", features = ["request-id", "trace","propagate-header","util", "cors", "fs"] }

# utils
## error handling
anyhow = "1.0"
thiserror = "1.0"
## command parse
clap = { version = "4.0", features = ["derive"] }
## config
dotenv = "0.15.0"
config = "0.13.3"
## logging
tracing = "0.1.43"
tracing-subscriber = { version = "0.3.22", features = ["env-filter", "fmt", "std", "local-time"] }
tracing-appender = { version = "0.2.4"}
## openraft
openraft = { git = "https://github.com/databendlabs/openraft.git", features = [
    "serde",
    "type-alias",
] }
futures = "0.3.32"
reqwest = { version = "0.11", features = ["json"] }
byteorder  = { version = "1.5.0" }
rand       = { version = "0.10.0-rc.9" }

[features]
test-utils = []

[dev-dependencies]
tower = "0.5"
